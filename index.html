<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Yabut Group Ledger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fff;--sf:#fff;--tx:#111;--mu:#666;--bd:#e5e5e5;--ac:#111;--ac2:#f3f3f3;--wn:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--sf);border-bottom:1px solid var(--bd);z-index:9;padding:8px 10px}
header select{width:100%;font-weight:600}
#nav{display:flex;gap:4px;overflow-x:auto;margin-top:6px}
#nav button{flex:none;background:none;border:0;padding:6px 10px;border-radius:6px;color:var(--mu);font:inherit}
#nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{padding:10px;max-width:900px;margin:auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:15px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px;min-width:0;box-sizing:border-box}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.g>.w{grid-column:1/-1}
button{cursor:pointer}button.pri{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
button.x{color:var(--wn)}
.mu{color:var(--mu)}.r{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.chips button{padding:3px 8px;font-size:13px;border-radius:99px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600}
td input,td select{width:100%;max-width:130px;padding:3px}
tr.sub td{background:var(--ac2);font-weight:600}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
textarea{width:100%;height:150px}
.big{font-size:20px;font-weight:700}
</style></head><body>
<header><select id="ps" onchange="S.cur=this.value;save();render()"></select><div id="nav"></div></header>
<main><div id="msg" class="mu"></div><div id="view"></div></main>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null;try{S=JSON.parse(localStorage.getItem('ygl'))}catch(e){}
if(!S)S={projects:[],items:{},cur:null};
const save=()=>{try{localStorage.setItem('ygl',JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const P=()=>S.projects.find(p=>p.id===S.cur);
const peso=n=>'₱'+(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{const n=+String(v==null?'':v).replace(/[₱,\s]/g,'');return isNaN(n)?0:n};
const tot=p=>p.entries.reduce((s,e)=>s+e.qty*e.cost,0);
const CATS=['Rebar & Steel','Cement, Sand & Gravel','CHB','Plumbing','Electrical','Paint & Finish','Lumber & Formworks','Roofing','Tools & Supplies','Fees & Others'];
function guess(n){n=n.toLowerCase();
 const R=[[/wire|cord|outlet|breaker|bulb|switch|conduit|electrical|rsc|thhn|socket|receptacle|utility box|amco|plug/,4],[/rebar|tie wire/,0],[/cement|sand|gravel/,1],[/chb/,2],[/roof|truss|purlin|gutter|flashing/,6+1],[/paint|latex|primer|epoxy|roller|brush|skimcoat|putty|sealer|gloss|reducer|masking|polituff/,5],[/lumber|palochina|plywood|phenolic|nail|formwork/,6],[/pvc|ppr|pipe|faucet|toilet|valve|clamp|elbow|wye|teflon|trap|clean out|solvent/,3],[/gate pass|id workers|apartment|bill|payment|dues|bond|lpg|blueprint/,9]];
 for(const [re,i] of R)if(re.test(n))return CATS[i];return CATS[8]}
const loc=d=>isNaN(d)?'':d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function pd(v){if(/^\d{5}$/.test(String(v)))v=+v;if(v instanceof Date)return loc(v);if(typeof v==='number'&&v>30000)return loc(new Date(1899,11,30+Math.floor(v)));
 const s=String(v||''),m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0'):/^\d{4}-\d\d-\d\d/.test(s)?s.slice(0,10):''}
function learn(e){const k=e.name.toLowerCase(),it=S.items[k]||(S.items[k]={name:e.name,n:0});it.unit=e.unit;it.supplier=e.supplier;it.cost=e.cost;it.cat=e.cat;it.n++}
const TABS=['Project','Ledger','Items','BOM','Statement','Progress'];
let tab='Ledger',edit=null,q='',arm=null,sup='',from='',to='',paid=0,inc=false,outText='',ROWS=[],TOP=[],IT=[];
function go(t){tab=t;outText='';q='';$('#msg').textContent='';render()}
function render(){
 $('#nav').innerHTML=TABS.map(t=>`<button class="${t===tab?'on':''}" onclick="go('${t}')">${t}</button>`).join('');
 const p=P();$('#ps').innerHTML=S.projects.map(x=>`<option value="${x.id}" ${x.id===S.cur?'selected':''}>${E(x.name)}</option>`).join('')||'<option>No project yet</option>';
 if(!p&&tab!=='Project'){$('#view').innerHTML='<p class="mu">Create a project first.</p>';return}
 $('#view').innerHTML=({Project:vProject,Ledger:vLedger,Items:vItems,BOM:vBom,Statement:vStmt,Progress:vProg})[tab](p)+(outText?`<div class="card"><h3>Copy this, then paste into Excel or Sheets</h3><textarea id="out" readonly onfocus="this.select()">${E(outText)}</textarea></div>`:'');
 if(tab==='Ledger')drawTb()}
function addP(){const n=$('#np').value.trim();if(!n)return;const p={id:uid(),name:n,location:$('#nl').value.trim(),budget:num($('#nb').value),entries:[],tasks:[]};S.projects.push(p);S.cur=p.id;save();go('Ledger')}
function delP(){if(arm!=='P'){arm='P';render();return}S.projects=S.projects.filter(x=>x.id!==S.cur);S.cur=S.projects.length?S.projects[0].id:null;arm=null;save();render()}
function vProject(p){return `<div class="card"><h3>New project</h3><div class="g"><input id="np" class="w" placeholder="Project / owner name"><input id="nl" placeholder="Location"><input id="nb" type="number" placeholder="Budget (₱)"><button class="pri w" onclick="addP()">Create project</button></div></div>`+
 (p?`<div class="card"><h3>Import ledger into ${E(p.name)}</h3><p class="mu">Use an Excel ledger with columns like ITEM NO, DESCRIPTION, QTY, UNIT, HARDWARE, UNIT COST, DELIVERY DATE.</p><input type="file" accept=".xlsx,.xls,.csv" onchange="impFile(this.files[0])"><p class="mu">Or paste rows copied from Excel:</p><textarea id="pi" placeholder="Paste rows here"></textarea><button class="pri" onclick="impText()">Import pasted rows</button></div>
 <div class="card"><h3>Backup</h3><p class="mu">Data is saved in this browser only. Copy a backup now and then.</p><button onclick="backup()">Show backup text</button> <button onclick="restore()">Restore from pasted text</button><p><button class="x" onclick="delP()">${arm==='P'?'Tap again to delete this project':'Delete this project'}</button></p></div>`:'')}
function impFile(f){if(!f)return;if(typeof XLSX==='undefined'){msg('Excel reader did not load. Use paste instead.');return}
 const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});importRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null}))}catch(x){msg('Could not read that file.')}};r.readAsArrayBuffer(f)}
function impText(){importRows($('#pi').value.split('\n').map(l=>l.split('\t')))}
function msg(t){$('#msg').textContent=t}
function importRows(rows){const p=P();if(!p)return;
 const hi=rows.findIndex(r=>r&&r.some(c=>/descr/i.test(String(c||''))));let m={n:1,q:2,u:3,s:4,c:5,d:7};
 if(hi>=0){const h=rows[hi].map(c=>String(c||'').toLowerCase()),f=re=>h.findIndex(x=>re.test(x));m={n:f(/descr/),q:f(/qty|quant/),u:f(/^unit$/),s:f(/hardware|supplier/),c:f(/unit cost|price/),d:f(/date/)}}
 let k=0;for(const r of rows.slice(hi+1)){if(!r)continue;const name=String(r[m.n]||'').trim();if(!name||/grand total/i.test(name+r[0]))continue;
  const e={id:uid(),name,qty:num(r[m.q]),unit:String(r[m.u]||'').trim(),supplier:String(r[m.s]||'').trim(),cost:num(r[m.c]),date:pd(r[m.d]),cat:guess(name)};p.entries.push(e);learn(e);k++}
 save();tab='Ledger';render();msg(k+' rows imported. Check categories and dates.')}
function backup(){outText=JSON.stringify(S);render()}
function restore(){const t=($('#pi')||{}).value;try{const d=JSON.parse(t);if(d&&d.projects){S=d;save();render();msg('Restored.')}}catch(e){msg('Paste the backup text in the box above first.')}}
function vLedger(p){TOP=Object.values(S.items).sort((a,b)=>b.n-a.n).slice(0,10);
 const sups=[...new Set(p.entries.map(e=>e.supplier).filter(Boolean))];
 return `<div class="card"><h3>Add item</h3><div class="chips">${TOP.map((t,i)=>`<button onclick="chip(${i})">${E(t.name)}</button>`).join('')}</div>
 <div class="g"><input id="fn" class="w" list="il" placeholder="Item" oninput="fill()" autocomplete="off"><input id="fq" type="number" step="any" placeholder="Qty" inputmode="decimal"><input id="fu" placeholder="Unit"><input id="fs" list="sl" placeholder="Supplier"><input id="fc" type="number" step="any" placeholder="Unit cost" inputmode="decimal"><input id="fd" type="date" value="${loc(new Date())}"><select id="fk">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><button id="fb" class="pri w" onclick="add()">Add</button></div>
 <datalist id="il">${Object.values(S.items).map(i=>`<option value="${E(i.name)}">`).join('')}</datalist><datalist id="sl">${sups.map(s=>`<option value="${E(s)}">`).join('')}</datalist></div>
 <div class="card"><input id="sq" placeholder="Search ledger" value="${E(q)}" oninput="q=this.value;drawTb()" style="width:100%"><p>Showing total: <b id="tt"></b></p><div class="sc" id="tb"></div></div>`}
function fill(){const it=S.items[$('#fn').value.trim().toLowerCase()];if(!it)return;$('#fu').value=it.unit||'';$('#fs').value=it.supplier||'';$('#fc').value=it.cost||'';$('#fk').value=it.cat||CATS[8];$('#fq').focus()}
function chip(i){$('#fn').value=TOP[i].name;fill()}
function add(){const p=P(),name=$('#fn').value.trim(),qty=num($('#fq').value);if(!name||!qty)return;
 const e={id:edit||uid(),name,qty,unit:$('#fu').value.trim(),supplier:$('#fs').value.trim(),cost:num($('#fc').value),date:$('#fd').value,cat:$('#fk').value};
 if(edit){const i=p.entries.findIndex(x=>x.id===edit);p.entries[i]=e}else{p.entries.push(e);learn(e)}
 edit=null;save();render();$('#fn').focus()}
function ed(id){const e=P().entries.find(x=>x.id===id);edit=id;$('#fn').value=e.name;$('#fq').value=e.qty;$('#fu').value=e.unit;$('#fs').value=e.supplier;$('#fc').value=e.cost;$('#fd').value=e.date;$('#fk').value=e.cat;$('#fb').textContent='Save changes';window.scrollTo(0,0)}
function dl(id){if(arm===id){P().entries=P().entries.filter(x=>x.id!==id);arm=null;save()}else arm=id;drawTb()}
function drawTb(){const p=P(),s=q.toLowerCase();const L=p.entries.filter(e=>!s||(e.name+e.supplier+e.cat).toLowerCase().includes(s)).reverse();
 $('#tt').textContent=peso(L.reduce((a,e)=>a+e.qty*e.cost,0))+' ('+L.length+' rows)';
 $('#tb').innerHTML='<table><tr><th>Date</th><th>Item</th><th class="r">Qty</th><th>Unit</th><th>Supplier</th><th class="r">Cost</th><th class="r">Total</th><th></th></tr>'+L.slice(0,150).map(e=>`<tr><td>${E(e.date)}</td><td>${E(e.name)}</td><td class="r">${e.qty}</td><td>${E(e.unit)}</td><td>${E(e.supplier)}</td><td class="r">${e.cost}</td><td class="r">${(e.qty*e.cost).toLocaleString('en-PH',{maximumFractionDigits:2})}</td><td><button onclick="ed('${e.id}')">Edit</button> <button class="x" onclick="dl('${e.id}')">${arm===e.id?'Sure?':'Del'}</button></td></tr>`).join('')+'</table>'+(L.length>150?'<p class="mu">Showing the latest 150. Use search to find others.</p>':'')}
function vItems(){IT=Object.keys(S.items).sort((a,b)=>S.items[b].n-S.items[a].n);const s=q.toLowerCase();
 return `<div class="card"><h3>Frequently bought items</h3><p class="mu">Built from your entries. Fix a price here and it fills in next time.</p><input placeholder="Search" value="${E(q)}" oninput="q=this.value;render()" style="width:100%"><div class="sc"><table><tr><th>Item</th><th>Bought</th><th>Unit</th><th>Supplier</th><th>Cost</th><th>Category</th><th></th></tr>`+
 IT.map((k,i)=>[k,i]).filter(([k])=>!s||k.includes(s)).slice(0,100).map(([k,i])=>{const t=S.items[k];return `<tr><td>${E(t.name)}</td><td>${t.n}x</td><td><input value="${E(t.unit)}" onchange="it_(${i},'unit',this.value)"></td><td><input value="${E(t.supplier)}" onchange="it_(${i},'supplier',this.value)"></td><td><input type="number" value="${t.cost}" onchange="it_(${i},'cost',this.value)"></td><td><select onchange="it_(${i},'cat',this.value)">${CATS.map(c=>`<option ${c===t.cat?'selected':''}>${c}</option>`).join('')}</select></td><td><button class="x" onclick="itd(${i})">${arm==='i'+i?'Sure?':'Del'}</button></td></tr>`}).join('')+'</table></div></div>'}
function it_(i,f,v){S.items[IT[i]][f]=f==='cost'?num(v):v;save()}
function itd(i){if(arm==='i'+i){delete S.items[IT[i]];arm=null;save()}else arm='i'+i;render()}
function cp(){outText=ROWS.map(r=>r.join('\t')).join('\n');try{navigator.clipboard.writeText(outText)}catch(e){}render()}
function vBom(p){const g={};p.entries.filter(e=>inc||e.cat!==CATS[9]).forEach(e=>{const k=e.name.toLowerCase()+'|'+e.unit.toLowerCase(),c=g[e.cat]||(g[e.cat]={});const r=c[k]||(c[k]={name:e.name,unit:e.unit,qty:0,t:0});r.qty+=e.qty;r.t+=e.qty*e.cost});
 ROWS=[['Category','Material','Qty','Unit','Avg unit cost','Total']];let gt=0,h='';
 CATS.forEach(c=>{if(!g[c])return;const L=Object.values(g[c]).sort((a,b)=>b.t-a.t),st=L.reduce((s,r)=>s+r.t,0);gt+=st;
  h+=`<tr class="sub"><td colspan="4">${c}</td><td class="r" colspan="2">${peso(st)}</td></tr>`+L.map(r=>{ROWS.push([c,r.name,r.qty,r.unit,+(r.t/r.qty||0).toFixed(2),+r.t.toFixed(2)]);return `<tr><td>${E(r.name)}</td><td class="r">${+r.qty.toFixed(2)}</td><td>${E(r.unit)}</td><td class="r">${(r.t/r.qty||0).toFixed(2)}</td><td class="r">${r.t.toLocaleString('en-PH',{maximumFractionDigits:2})}</td><td></td></tr>`}).join('')});
 ROWS.push(['','','','','Grand total',+gt.toFixed(2)]);
 return `<div class="card"><h3>Bill of Materials</h3><label><input type="checkbox" ${inc?'checked':''} onchange="inc=this.checked;render()"> Include fees and others</label><p class="big">${peso(gt)}</p><div class="sc"><table><tr><th>Material</th><th class="r">Qty</th><th>Unit</th><th class="r">Avg cost</th><th class="r">Total</th><th></th></tr>${h}</table></div><p><button class="pri" onclick="cp()">Copy for Excel</button></p></div>`}
function vStmt(p){const sups=[...new Set(p.entries.map(e=>e.supplier||'(none)'))].sort();
 const L=p.entries.filter(e=>(!sup||(e.supplier||'(none)')===sup)&&(!from||e.date>=from)&&(!to||e.date<=to)).sort((a,b)=>a.date.localeCompare(b.date));
 const t=L.reduce((s,e)=>s+e.qty*e.cost,0);
 ROWS=[['Project',p.name,'','','',''],['Supplier',sup||'All','','','',''],['Date','Item','Qty','Unit','Unit cost','Total']].concat(L.map(e=>[e.date,e.name,e.qty,e.unit,e.cost,+(e.qty*e.cost).toFixed(2)]),[['','','','','Total',+t.toFixed(2)],['','','','','Less payments',paid],['','','','','Balance',+(t-paid).toFixed(2)]]);
 return `<div class="card"><h3>Statement</h3><div class="g"><select class="w" onchange="sup=this.value;render()"><option value="">All suppliers</option>${sups.map(s=>`<option ${s===sup?'selected':''}>${E(s)}</option>`).join('')}</select><input type="date" value="${from}" onchange="from=this.value;render()"><input type="date" value="${to}" onchange="to=this.value;render()"><input class="w" type="number" placeholder="Less: payments made" value="${paid||''}" onchange="paid=num(this.value);render()"></div>
 <p>Total <b>${peso(t)}</b><br>Balance <span class="big">${peso(t-paid)}</span></p><div class="sc"><table><tr><th>Date</th><th>Item</th><th class="r">Qty</th><th>Unit</th><th class="r">Total</th></tr>${L.slice(0,300).map(e=>`<tr><td>${E(e.date)}</td><td>${E(e.name)}</td><td class="r">${e.qty}</td><td>${E(e.unit)}</td><td class="r">${(e.qty*e.cost).toLocaleString('en-PH',{maximumFractionDigits:2})}</td></tr>`).join('')}</table></div><p><button class="pri" onclick="cp()">Copy for Excel</button></p></div>`}
function tk(id,f,v){const t=P().tasks.find(x=>x.id===id);t[f]=f==='name'?v:num(v);save();render()}
function addT(){const n=$('#tn').value.trim();if(!n)return;P().tasks.push({id:uid(),name:n,w:num($('#tw').value)||1,pct:0});save();render()}
function delT(id){if(arm===id){P().tasks=P().tasks.filter(x=>x.id!==id);arm=null;save()}else arm=id;render()}
function vProg(p){const sp=tot(p),b=+p.budget||0,tw=p.tasks.reduce((s,t)=>s+t.w,0),ov=tw?p.tasks.reduce((s,t)=>s+t.w*t.pct,0)/tw:0;
 const bar=v=>`<div class="bar"><i style="width:${Math.min(100,Math.max(0,v))}%"></i></div>`;
 return `<div class="card"><h3>Overall progress</h3><p class="big">${ov.toFixed(1)}%</p>${bar(ov)}</div>
 <div class="card"><h3>Budget</h3><input type="number" placeholder="Project budget (₱)" value="${b||''}" onchange="P().budget=num(this.value);save();render()" style="width:100%"><p>Spent ${peso(sp)}${b?' of '+peso(b)+' ('+(sp/b*100).toFixed(1)+'%)':''}</p>${b?bar(sp/b*100):''}</div>
 <div class="card"><h3>Work items</h3>${p.tasks.map(t=>`<div style="margin-bottom:10px"><div style="display:flex;gap:6px;align-items:center"><b style="flex:1">${E(t.name)}</b><span class="mu">weight</span><input type="number" value="${t.w}" style="width:60px" onchange="tk('${t.id}','w',this.value)"><button class="x" onclick="delT('${t.id}')">${arm===t.id?'Sure?':'Del'}</button></div><input type="range" min="0" max="100" step="5" value="${t.pct}" style="width:100%" onchange="tk('${t.id}','pct',this.value)"><span class="mu">${t.pct}%</span></div>`).join('')||'<p class="mu">No work items yet.</p>'}
 <div class="g"><input id="tn" placeholder="e.g. Foundation, Walls, Roofing"><input id="tw" type="number" placeholder="Weight (default 1)"><button class="pri w" onclick="addT()">Add work item</button></div></div>`}
if(!S.projects.length)tab='Project';else if(!P())S.cur=S.projects[0].id;
render();
</script></body></html>
